# ---------------------------------------------------------------------------
# ShiftFlow — Docker Compose
#
# Services: `db` (SQL Server), `api` (ASP.NET Core), and the one-shot
# `recommender`. The `web` (nginx) service is added in the full-compose phase
# (CLAUDE.md §10 / docs/02 §6).
#
#     docker compose up --build        # db + api
#
# In Development the api applies migrations and inserts the scenario seed on
# startup, so a cold start on an empty volume ends with a ready database.
#
# `recommender` sits behind a Compose profile so `docker compose up` never
# starts it. Run it on demand, once the api (or database/*.sql) has created the
# schema and seed:
#
#     docker compose run --rm recommender
# ---------------------------------------------------------------------------

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shiftflow-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # `depends_on` alone only waits for container start, not for SQL Server
      # to accept connections (CLAUDE.md §11). Later services must use
      # `depends_on: { db: { condition: service_healthy } }`.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: shiftflow-api
    depends_on:
      db:
        # Not just "started" — `depends_on` alone would let the API race SQL
        # Server's warm-up and crash on the first migration (CLAUDE.md §11).
        condition: service_healthy
    environment:
      # Development turns on Swagger and the migrate + seed on startup
      # (DevelopmentDataExtensions). Kestrel binds plain HTTP only.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Both secrets come from .env. The connection string is assembled from
      # its parts because MSSQL_HOST differs by context: `db` (this compose
      # network) here, `localhost` for a local `dotnet run`. Inside the network
      # the db container always listens on 1433 regardless of MSSQL_PORT, which
      # only maps the host side.
      ConnectionStrings__Default: "Server=${MSSQL_HOST:-db},1433;Database=${MSSQL_DB:-ShiftFlow};User Id=sa;Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True"
      Jwt__Key: ${Jwt__Key:?set Jwt__Key in .env}
      Attendance__StalenessThresholdSeconds: ${Attendance__StalenessThresholdSeconds:-120}
    ports:
      - "${API_PORT:-8080}:8080"

  # One-shot applicant recommender. `profiles` keeps it out of `docker compose
  # up`; `docker compose run --rm recommender` enables the profile for that one
  # invocation. It scores every Open shift's applicants and exits.
  recommender:
    profiles: ["recommender"]
    build:
      context: .
      dockerfile: docker/recommender.Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the Compose network the database is reachable as `db:1433`.
      MSSQL_HOST: db
      MSSQL_PORT: "1433"
      MSSQL_DB: ${MSSQL_DB:-ShiftFlow}
      MSSQL_SA_USER: sa
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      # Shared scoring knobs — same names the API binds (docs/02 §5). Unset ->
      # config.py falls back to the CLAUDE.md §5 defaults.
      SCORING__RATINGWEIGHT: ${SCORING__RATINGWEIGHT:-0.30}
      SCORING__WORKLOADWEIGHT: ${SCORING__WORKLOADWEIGHT:-0.30}
      SCORING__AVAILABILITYWEIGHT: ${SCORING__AVAILABILITYWEIGHT:-0.40}
      SCORING__MONTHLYCAP: ${SCORING__MONTHLYCAP:-160}
      SCORING__RATINGDEFAULT: ${SCORING__RATINGDEFAULT:-3.0}

volumes:
  mssql-data:
