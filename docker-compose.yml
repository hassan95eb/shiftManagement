# ---------------------------------------------------------------------------
# ShiftFlow — Docker Compose
#
# Services so far: `db` (SQL Server) and the one-shot `recommender`. The `api`
# and `web` services are added in the full-compose phase (CLAUDE.md §10 / docs/02
# §6).
#
# `recommender` sits behind a Compose profile so `docker compose up` never
# starts it. Run it on demand, against a database that already has the schema
# and seed (the api service or database/*.sql):
#
#     docker compose run --rm recommender
# ---------------------------------------------------------------------------

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shiftflow-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # `depends_on` alone only waits for container start, not for SQL Server
      # to accept connections (CLAUDE.md §11). Later services must use
      # `depends_on: { db: { condition: service_healthy } }`.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # One-shot applicant recommender. `profiles` keeps it out of `docker compose
  # up`; `docker compose run --rm recommender` enables the profile for that one
  # invocation. It scores every Open shift's applicants and exits.
  recommender:
    profiles: ["recommender"]
    build:
      context: .
      dockerfile: docker/recommender.Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the Compose network the database is reachable as `db:1433`.
      MSSQL_HOST: db
      MSSQL_PORT: "1433"
      MSSQL_DB: ${MSSQL_DB:-ShiftFlow}
      MSSQL_SA_USER: sa
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      # Shared scoring knobs — same names the API binds (docs/02 §5). Unset ->
      # config.py falls back to the CLAUDE.md §5 defaults.
      SCORING__RATINGWEIGHT: ${SCORING__RATINGWEIGHT:-0.30}
      SCORING__WORKLOADWEIGHT: ${SCORING__WORKLOADWEIGHT:-0.30}
      SCORING__AVAILABILITYWEIGHT: ${SCORING__AVAILABILITYWEIGHT:-0.40}
      SCORING__MONTHLYCAP: ${SCORING__MONTHLYCAP:-160}
      SCORING__RATINGDEFAULT: ${SCORING__RATINGDEFAULT:-3.0}

volumes:
  mssql-data:
