name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/ShiftFlow.sln

      - name: Build
        run: dotnet build backend/ShiftFlow.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/ShiftFlow.sln --configuration Release --no-build --verbosity normal

